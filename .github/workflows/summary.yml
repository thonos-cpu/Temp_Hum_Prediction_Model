name: Auto-Fix Issue with GitHub Models

on:
  issues:
    types: [opened]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Inference for Fix
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o 
          prompt: |
            You are an expert developer fixing an issue in this repository.
            Analyze the issue details below, look at the codebase context, and fix it by creating or updating the necessary file.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

            CRITICAL: You must wrap your responses exactly inside the requested XML tags below. Do not include markdown code fences (```) around the file content.

            <explanation>
            Write a short, clear explanation here of what you fixed.
            </explanation>

            <file_path>
            Provide the relative path of the file to create or update (e.g., LICENSE or README.md).
            </file_path>

            <file_content>
            Paste the complete, full contents of the file here.
            </file_content>

      - name: Process AI Response and Apply Fix
        id: apply-fix
        env:
          AI_RAW_RESPONSE: ${{ steps.inference.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Save response securely to file using a strict heredoc delimiter
          cat << 'EOF_AI' > ai_raw.txt
          $AI_RAW_RESPONSE
          EOF_AI

          # Clean up any potential carriage returns
          sed -i 's/\r//' ai_raw.txt

          # Parse the tags cleanly using sed
          sed -n '/<explanation>/,/\/explanation>/p' ai_raw.txt | sed '1d;$d' > pr_explanation.md
          
          FILE_PATH=$(sed -n '/<file_path>/,/\/file_path>/p' ai_raw.txt | sed '1d;$d' | tr -d '[:space:]')
          sed -n '/<file_content>/,/\/file_content>/p' ai_raw.txt | sed '1d;$d' > temp_code_file

          # Fallback check if the AI misformatted the path tag slightly
          if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" = "null" ]; then
            echo "Error: AI failed to provide a valid target file path."
            echo "branch_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Ensure the target directory exists and move the file into place
          mkdir -p "$(dirname "$FILE_PATH")"
          mv temp_code_file "$FILE_PATH"
          
          # Setup Git configs securely
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force set the branch name cleanly using the issue number
          BRANCH_NAME="ai-fix-issue-$ISSUE_NUMBER"
          git checkout -b "$BRANCH_NAME"
          
          git add "$FILE_PATH"
          if ! git diff-index --quiet HEAD --; then
            git commit -m "AI automated fix for #$ISSUE_NUMBER"
            git push origin "$BRANCH_NAME"
            echo "branch_created=true" >> $GITHUB_OUTPUT
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "No changes detected."
            echo "branch_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.apply-fix.outputs.branch_created == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.apply-fix.outputs.branch_name }}
          title: "AI Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Automated PR via GitHub Models
            This PR was automatically generated to address Issue #${{ github.event.issue.number }}.
          base: main

      - name: Comment Explanation on PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          EXPLANATION=$(cat pr_explanation.md)
          
          COMMENT_BODY=$(cat <<EOF
          ## 🛠️ How I fixed this:
          $EXPLANATION
          
          Please review the modifications in the files changed tab above!
          EOF
          )
          
          gh pr comment ${{ steps.cpr.outputs.pull-request-number }} --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

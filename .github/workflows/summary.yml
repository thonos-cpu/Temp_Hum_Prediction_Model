name: Auto-Fix Issue with GitHub Models

on:
  issues:
    types: [opened]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Inference for Fix
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o 
          prompt: |
            You are an expert developer fixing an issue in this repository.
            Analyze the issue details below, look at the codebase context, and fix it.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

            CRITICAL: You must format your response exactly like this template so my automated parser can read it:

            [EXPLANATION]
            Write your short, clear explanation here of what you fixed.

            [FILE_PATH]
            path/to/the/modified/file.ext

            [CODE]
            ```
            Paste the entire, complete contents of the modified file here. Do not skip lines.
            ```

      - name: Process AI Response and Apply Fix
        id: apply-fix
        env:
          AI_RAW_RESPONSE: ${{ steps.inference.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Save the response safely to a file without shell injection/quoting issues
          cat << 'EOF' > ai_raw.txt
          $AI_RAW_RESPONSE
          EOF

          # Clean up carriage returns just in case
          sed -i 's/\r//' ai_raw.txt

          # Parse Explanation
          sed -n '/\[EXPLANATION\]/,/\[FILE_PATH\]/p' ai_raw.txt | sed '1d;$d' > pr_explanation.md

          # Parse File Path (clean up spaces and newlines)
          FILE_PATH=$(sed -n '/\[FILE_PATH\]/,/\[CODE\]/p' ai_raw.txt | sed '1d;$d' | tr -d '[:space:]')
          
          if [ -z "$FILE_PATH" ]; then
            echo "Error: AI failed to provide a readable file path."
            echo "branch_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse Code Block (Extract content inside the markdown code block)
          sed -n '/\[CODE\]/,/```/p' ai_raw.txt | sed -n '/```/,/```/p' | sed '1d;$d' > temp_code_file

          # Verify if code extraction succeeded
          if [ ! -s temp_code_file ]; then
            echo "Error: AI failed to provide a valid code block."
            echo "branch_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Ensure target directory exists and overwrite the file completely
          mkdir -p "$(dirname "$FILE_PATH")"
          mv temp_code_file "$FILE_PATH"
          
          # Configure Git safely with fallback variables
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force set the branch name cleanly
          BRANCH_NAME="ai-fix-issue-$ISSUE_NUMBER"
          git checkout -b "$BRANCH_NAME"
          
          git add "$FILE_PATH"
          if ! git diff-index --quiet HEAD --; then
            git commit -m "AI automated fix for #$ISSUE_NUMBER"
            git push origin "$BRANCH_NAME"
            echo "branch_created=true" >> $GITHUB_OUTPUT
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "No changes detected."
            echo "branch_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.apply-fix.outputs.branch_created == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.apply-fix.outputs.branch_name }}
          title: "AI Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Automated PR via GitHub Models
            This PR was automatically generated to address Issue #${{ github.event.issue.number }}.
          base: main

      - name: Comment Explanation on PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          EXPLANATION=$(cat pr_explanation.md)
          
          COMMENT_BODY=$(cat <<EOF
          ## 🛠️ How I fixed this:
          $EXPLANATION
          
          Please review the modifications in the files changed tab above!
          EOF
          )
          
          gh pr comment ${{ steps.cpr.outputs.pull-request-number }} --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto-Fix Issue with GitHub Models

on:
  issues:
    types: [opened]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Inference for Fix
        id: inference
        uses: actions/ai-inference@v1
        with:
          # You can specify models like gpt-4o, claude-3-5-sonnet, etc., depending on your GitHub Models access
          model: gpt-4o 
          prompt: |
            You are an expert developer fixing an issue in this repository.
            Analyze the issue details below and generate a unified git diff/patch to fix it.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

            CRITICAL: Your entire response must be a single, valid JSON object with exactly two keys: "explanation" and "patch". Do not wrap the JSON in markdown code blocks.
            
            Example format:
            {
              "explanation": "I fixed the bug by adding a validation check to main.js.",
              "patch": "diff --git a/main.js b/main.js\n--- a/main.js\n+++ b/main.js\n@@ -1,3 +1,4 @@\n+if (!input) return;"
            }

      - name: Process AI Response and Apply Fix
        id: apply-fix
        run: |
          # Save the raw response to a file
          echo '${{ steps.inference.outputs.response }}' > ai_response.json
          
          # Extract the explanation and patch using jq
          jq -r '.explanation' ai_response.json > pr_explanation.md
          jq -r '.patch' ai_response.json > fix.patch
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create branch and apply the patch
          BRANCH_NAME="ai/fix-issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          
          if [ -s fix.patch ]; then
            git apply fix.patch
            git add .
            git commit -m "AI fix for #${{ github.event.issue.number }}"
            git push origin "$BRANCH_NAME"
            echo "branch_created=true" >> $GITHUB_OUTPUT
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "No valid patch generated."
            echo "branch_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.apply-fix.outputs.branch_created == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.apply-fix.outputs.branch_name }}
          title: "AI Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Automated PR via GitHub Models
            This PR was automatically generated to address Issue #${{ github.event.issue.number }}.
          base: main

      - name: Comment Explanation on PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          # Read the explanation generated by the AI
          EXPLANATION=$(cat pr_explanation.md)
          
          # Format the comment body
          COMMENT_BODY=$(cat <<EOF
          ## 🛠️ How I fixed this:
          $EXPLANATION
          
          Please review the patch changes in the diff tab!
          EOF
          )
          
          # Post comment to the newly created Pull Request
          gh pr comment ${{ steps.cpr.outputs.pull-request-number }} --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

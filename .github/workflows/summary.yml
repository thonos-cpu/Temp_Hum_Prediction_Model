name: Auto-Fix Issue with GitHub Models

on:
  issues:
    types: [opened]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Inference for Fix
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o 
          prompt: |
            You are an expert developer fixing an issue in this repository.
            Analyze the issue details below, look at the codebase context, and provide the complete fixed file content for the file that needs changing.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

            CRITICAL: Your entire response must be a single, valid JSON object with exactly three keys: "explanation", "file_path", and "file_content". 
            Do not wrap the JSON in markdown code blocks. The "file_content" must be the complete, full text of the file after the fix is applied.
            
            Example format:
            {
              "explanation": "I fixed the bug by adding validation to main.js.",
              "file_path": "src/main.js",
              "file_content": "const express = require('express');\nconst app = express();\n// ... full file code here ..."
            }

      - name: Process AI Response and Apply Fix
        id: apply-fix
        run: |
          # Save the raw response to a file safely
          echo '${{ steps.inference.outputs.response }}' > ai_response.json
          
          # Extract values using jq
          jq -r '.explanation' ai_response.json > pr_explanation.md
          FILE_PATH=$(jq -r '.file_path' ai_response.json)
          
          # Ensure the file path isn't empty or null
          if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" = "null" ]; then
            echo "AI did not return a valid file path."
            echo "branch_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract full file content directly into the destination file
          jq -r '.file_content' ai_response.json > "$FILE_PATH"
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create branch and commit changes
          BRANCH_NAME="ai/fix-issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          
          git add "$FILE_PATH"
          if ! git diff-index --quiet HEAD --; then
            git commit -m "AI fix for #${{ github.event.issue.number }}"
            git push origin "$BRANCH_NAME"
            echo "branch_created=true" >> $GITHUB_OUTPUT
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in the file."
            echo "branch_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.apply-fix.outputs.branch_created == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.apply-fix.outputs.branch_name }}
          title: "AI Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## 🤖 Automated PR via GitHub Models
            This PR was automatically generated to address Issue #${{ github.event.issue.number }}.
          base: main

      - name: Comment Explanation on PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          EXPLANATION=$(cat pr_explanation.md)
          
          COMMENT_BODY=$(cat <<EOF
          ## 🛠️ How I fixed this:
          $EXPLANATION
          
          Please review the code modifications in the diff tab above!
          EOF
          )
          
          gh pr comment ${{ steps.cpr.outputs.pull-request-number }} --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
